<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArcGIS Location Platform Sandbox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="auth" class="auth">
    <form id="auth-form" class="auth-card">
      <p class="eyebrow">ArcGIS Location Platform</p>
      <h1>Developer Sandbox</h1>
      <p>Enter your ArcGIS API key to try the lessons. It is stored in this browser tab only.</p>
      <label for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="off" placeholder="AAPK..." required>
      <button type="submit">Start sandbox</button>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="menu" type="button" class="quiet mobile-menu" aria-controls="sidebar" aria-expanded="false">Lessons</button>
      <strong>ArcGIS Location Platform Sandbox</strong>
      <button id="change-key" type="button" class="quiet">Change API key</button>
    </header>

    <aside id="sidebar" class="sidebar" aria-label="Lessons">
      <h2>Lessons</h2>
      <nav id="navigation"></nav>
    </aside>

    <main class="main">
      <div class="toolbar">
        <h1 id="lesson-title">Mapping</h1>
        <div class="actions">
          <button id="toggle-code" type="button" class="quiet" aria-pressed="false">Show code</button>
          <button id="run-code" type="button" hidden>Run code</button>
          <button id="reset-code" type="button" class="quiet" hidden>Reset</button>
        </div>
      </div>
      <div id="workspace" class="workspace">
        <iframe id="preview" title="Interactive ArcGIS lesson"></iframe>
        <section id="code-panel" class="code-panel" aria-label="Editable lesson HTML" hidden>
          <p id="code-status" class="code-status" role="status"></p>
          <div id="editor-host" hidden></div>
          <textarea id="code-input" spellcheck="false" aria-label="Lesson HTML source"></textarea>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
